# RudramOS kernel hardening (docs/DESIGN.md §4.6). Network settings come with Phase 6.

# Hide kernel addresses and kernel log from normal users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# No replacing the running kernel (kexec) once booted
kernel.kexec_load_disabled = 1

# Processes can only debug (ptrace) their own children; debuggers still work when they start the program
kernel.yama.ptrace_scope = 1

# Harden JIT-compiled BPF; unprivileged BPF stays off (Fedora default)
net.core.bpf_jit_harden = 2
kernel.unprivileged_bpf_disabled = 1

# Don't auto-load TTY line disciplines (old attack surface)
dev.tty.ldisc_autoload = 0

# Stricter rules for files in shared writable folders like /tmp
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# No core dumps from setuid programs (could leak secrets)
fs.suid_dumpable = 0
