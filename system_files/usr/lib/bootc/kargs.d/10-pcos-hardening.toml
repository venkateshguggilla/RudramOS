# PC OS kernel hardening (docs/DESIGN.md §4.6). Conservative set: chosen to not break
# apps, games or drivers. Applied on install and on the next update after it's added.
#   slab_nomerge              keep kernel object caches separate (heap exploit mitigation)
#   init_on_alloc / init_on_free   zero memory on allocation and free (stops data leaks; ~1-3% cost)
#   page_alloc.shuffle        randomize page allocator free lists
#   randomize_kstack_offset   randomize kernel stack offset per system call
#   vsyscall=none             remove the legacy fixed-address vsyscall page
# Not used: module.sig_enforce (Secure Boot already enforces signed modules, and with
# Secure Boot off it would block the NVIDIA driver); iommu=force (breaks some hardware).
kargs = ["slab_nomerge", "init_on_alloc=1", "init_on_free=1", "page_alloc.shuffle=1", "randomize_kstack_offset=on", "vsyscall=none"]
